services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-indra
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - backend

  webserver:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - .:/var/www
      - ./docker-config/nginx:/etc/nginx/conf.d/
    networks:
      - backend

  db:
    image: mysql:8.0
    container_name: speedukedinasan
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: speedukedinasan
      MYSQL_ROOT_PASSWORD: stmkgJ@ya21
    ports:
      - "3307:3306"
    networks:
      - backend
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel_pma
    restart: unless-stopped
    ports:
      - "8081:80" # Kamu akses lewat port 8081
    environment:
      - PMA_HOST=db # Harus sama dengan nama service database di atas
      - PMA_USER=root
      - PMA_PASSWORD=password
    networks:
      - backend

networks:
  backend:
    driver: bridge